services:
  jekyll:
    image: ruby:3.3-bookworm
    #working_dir hace que el contenedor se inicie en la ruta especificada, en este caso /proyecto. Esto es útil para asegurarse de que todos los comandos se ejecuten en el directorio correcto dentro del contenedor.
    working_dir: /proyecto
    #Ejecuta el proceso con un usuario no root para mejorar la seguridad. El usuario "jekyll" se crea dentro del contenedor y se le asigna un UID y GID específicos.
    user: "${JEKILL_UID:-1000}:${JEKILL_GID:-1000}"
    #Define las variables de entorno necesarias para la configuración de Jekyll y Bundler. Estas variables permiten personalizar el comportamiento del contenedor según las necesidades del proyecto.
    environment:
      BUNDLE_USER_HOME: /tmp/jekyll-bundler
    
    volumes:
      #Carpeta del proyecto en el host se monta en /proyecto dentro del contenedor, permitiendo que los cambios realizados en el host se reflejen en el contenedor y viceversa.
      - .:/proyecto
      #Docker guarda las gemas instaladas en un volumen persistente llamado "gemas", que se monta en /usr/local/bundle dentro del contenedor. Esto asegura que las dependencias de Ruby se mantengan entre reinicios del contenedor y no se pierdan.
      - gemas:/usr/local/bundle
    
    ports:
      #IP LOCAL: puerto de nuestro equipo: puerto del contenedor. Esto permite acceder a la aplicación Jekyll desde el navegador en el puerto 4000 de la máquina host, redirigiendo las solicitudes al puerto 4000 dentro del contenedor donde Jekyll está sirviendo el sitio.
      - "127.0.0.1:4000:4000"
      #Segundo puerto para que el navegador pueda recargar automáticamente la página cuando se detecten cambios en los archivos del proyecto. Esto es útil para el desarrollo en vivo, ya que permite ver los cambios sin tener que actualizar manualmente el navegador.
      - "127.0.0.1:35729:35729"

    command:
      - sh
      - -ec
      - |
        #Solo en el primer arranque de un proyecto vacio.
        if [ ! -f docs/Gemfile ]; then
          gem install jekyll --version 3.10.0 --no-document
          jekyll _3.10.0_ new docs --skip-bundle
        fi

        #Bundler instala las dependencias que falten y luego arranca Jekyll
        cd docs
        bundle check || bundle install
        exec bundle exec jekyll serve --host 0.0.0.0 --port 4000 \
          --watch --force_polling --livereload --livereload-port 35729

volumes:
  gemas:
